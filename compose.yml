services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
      target: dev
    container_name: quadrata64-server
    environment:
      PORT: ${SERVER_PORT:-3000}
    ports:
      - "${SERVER_PORT:-3000}:3000"
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules

  client:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
      target: dev
    container_name: quadrata64-client
    depends_on:
      - server
    environment:
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:3000}
    ports:
      - "${CLIENT_PORT:-5173}:5173"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules

volumes:
  server_node_modules:
  client_node_modules:
